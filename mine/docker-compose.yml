services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mine
      POSTGRES_PASSWORD: mine
      POSTGRES_DB: mine
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mine"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mine-api:
    build: .
    command: uvicorn mine.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+asyncpg://mine:mine@postgres:5432/mine
      DATABASE_URL_SYNC: postgresql+psycopg2://mine:mine@postgres:5432/mine
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mine-scheduler:
    build: .
    command: celery -A mine.celery_app:celery beat --loglevel=info
    volumes:
      - ./src:/app/src
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL_SYNC: postgresql+psycopg2://mine:mine@postgres:5432/mine
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy

  mine-worker:
    build: .
    command: celery -A mine.celery_app:celery worker --loglevel=info --concurrency=2
    volumes:
      - ./src:/app/src
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL_SYNC: postgresql+psycopg2://mine:mine@postgres:5432/mine
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://aihubmix.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gemini-3.1-pro-preview-search}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      TWITTERAPI_IO_KEY: ${TWITTERAPI_IO_KEY:-}
      RSSHUB_BASE_URL: ${RSSHUB_BASE_URL:-http://rsshub:1200}
      RSSHUB_ACCESS_KEY: ${RSSHUB_ACCESS_KEY:-forge_mine_2026}
      PROXY_URLS: ${PROXY_URLS:-}
      PROXY_API_URL: ${PROXY_API_URL:-}
      PROXY_API_REFRESH_SECONDS: ${PROXY_API_REFRESH_SECONDS:-60}
      PROXY_API_PROTOCOL: ${PROXY_API_PROTOCOL:-http}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-5}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mine-tagger:
    build: .
    command: celery -A mine.celery_app:celery worker --loglevel=info --concurrency=6 -Q tagging -n tagger@%h
    volumes:
      - ./src:/app/src
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL_SYNC: postgresql+psycopg2://mine:mine@postgres:5432/mine
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://aihubmix.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gemini-3.1-pro-preview-search}
      OPENAI_MODEL_LIGHT: ${OPENAI_MODEL_LIGHT:-gemini-3.1-flash-lite-preview}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  rsshub:
    image: diygod/rsshub:latest
    ports:
      - "1200:1200"
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/3
      ACCESS_KEY: forge_mine_2026
      REQUEST_TIMEOUT: 30000
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:1200/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - mine-api

volumes:
  pgdata:
